name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The signing key only exists as encrypted repository secrets and in the runner's temp directory
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "keystore.file=$RUNNER_TEMP/release.jks"
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "signing.key.alias=$KEY_ALIAS"
            echo "signing.key.password=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"

      - name: Build
        env:
          JELLYFIN_FIRE_SIGNING: ${{ runner.temp }}/signing.properties
        run: ./fire.sh build

      - name: Remove signing data
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.properties"

      - uses: actions/upload-artifact@v4
        with:
          name: JellyfinFire
          path: dist/*.apk
          if-no-files-found: error

      # Tags like v2.7.3-fire1 additionally publish the APK as a release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Jellyfin Fire $GITHUB_REF_NAME" --generate-notes
